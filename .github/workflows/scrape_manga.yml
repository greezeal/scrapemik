name: Scrape KomikIndo Comics - Advanced

on:
  schedule:
    # Multiple schedule options:
    - cron: '0 */3 * * *'  # Setiap 3 jam
    - cron: '0 0 * * *'    # Setiap hari jam 00:00 UTC
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to scrape'
        required: false
        default: '5'
      delay:
        description: 'Delay between requests'
        required: false
        default: '1.0'
  push:
    branches: [ main, master ]

env:
  MAX_PAGES: 5
  DELAY_PAGE: 1.0
  DELAY_CHAPTER: 0.5

jobs:
  scrape-comics:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, '3.10']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
        pip list
        
    - name: Create necessary directories
      run: |
        mkdir -p comics
        ls -la
        
    - name: Display Python info
      run: |
        python --version
        pip --version
        
    - name: Run KomikIndo Scraper
      run: |
        echo "Starting KomikIndo scraper..."
        echo "MAX_PAGES: ${{ env.MAX_PAGES }}"
        echo "DELAY_PAGE: ${{ env.DELAY_PAGE }}"
        echo "DELAY_CHAPTER: ${{ env.DELAY_CHAPTER }}"
        python scrape.py
      env:
        MAX_PAGES: ${{ env.MAX_PAGES }}
        DELAY_PAGE: ${{ env.DELAY_PAGE }}
        DELAY_CHAPTER: ${{ env.DELAY_CHAPTER }}
      timeout-minutes: 45
      
    - name: Show scraping results
      run: |
        echo "Scraping completed!"
        echo "Files in comics directory:"
        ls -la comics/ | head -20
        echo "Total comic files: $(find comics/ -name "*.json" | wc -l)"
        
    - name: Commit and push scraped data
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Check if there are changes in comics directory
        if git diff --name-only --exit-code comics/; then
          echo "No changes to commit"
        else
          git add comics/
          git commit -m "🤖 Auto-update: Komik data $(date +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "Changes committed and pushed successfully"
        fi
      continue-on-error: true
      
    - name: Upload comics as artifact
      uses: actions/upload-artifact@v4
      with:
        name: komik-data
        path: comics/
        retention-days: 7
        
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          const { repo, owner } = context.repo;
          github.rest.issues.create({
            owner,
            repo,
            title: '🚨 Scraping Job Failed',
            body: `KomikIndo scraping job failed. Please check the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
          });