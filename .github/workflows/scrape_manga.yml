name: Scrape KomikIndo Comics

on:
  schedule:
    - cron: '0 */6 * * *'  # Setiap 6 jam (kurangi frekuensi)
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape-comics:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
        
    - name: Create comics directory
      run: mkdir -p comics
      
    - name: Run scraping script with improved anti-blocking
      run: python scrape.py
      timeout-minutes: 60
      
    - name: Commit and push if changes
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add comics/
        git diff --staged --quiet || git commit -m "🤖 Auto-update: Komik data $(date +'%Y-%m-%d %H:%M UTC')"
        git push