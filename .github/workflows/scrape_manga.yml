name: Scrape KomikIndo Comics

on:
  schedule:
    - cron: '0 */3 * * *'  # Setiap 3 jam
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  scrape-comics:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'  # Hanya satu versi Python
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml
        
    - name: Create comics directory
      run: mkdir -p comics
      
    - name: Add random delays and user agents
      run: |
        echo "Mengkonfigurasi script untuk menghindari blocking..."
        # Tambahkan konfigurasi untuk menghindari detection
        sed -i 's/DELAY_PAGE = 1.0/DELAY_PAGE = 2.0/g' scrape.py
        sed -i 's/DELAY_CHAPTER = 0.5/DELAY_CHAPTER = 1.5/g' scrape.py
        sed -i 's/timeout=15/timeout=30/g' scrape.py
      
    - name: Run scraping script with retry
      run: |
        echo "Menjalankan scraper dengan retry mechanism..."
        for i in {1..3}; do
          echo "Attempt $i"
          python scrape.py && break
          echo "Failed, waiting 10 seconds before retry..."
          sleep 10
        done
      timeout-minutes: 60
      
    - name: Commit and push if changes
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add comics/
        git diff --staged --quiet || git commit -m "Auto-update: Komik data $(date +'%Y-%m-%d %H:%M UTC')"
        git push